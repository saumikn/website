<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Mapping US Big-3 Airline Routes</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="./vendor/maplibre/maplibre-gl.css" />
    <link rel="stylesheet" href="./leaflet/map.css" />
    <script type="importmap">
      {
        "imports": {
          "leaflet": "./vendor/leaflet/leaflet-src.esm.js",
          "maplibre-gl": "./vendor/maplibre/maplibre-gl.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div id="map" aria-label="Airline routes map"></div>
    <p id="map-status" role="status" hidden></p>
    <script type="module">
      import * as L from "leaflet";
      import { getMap } from "./leaflet/map.js";
      import { addBackground } from "./leaflet/background.js";

      const map = L.map("map", {
        minZoom: 1,
        maxZoom: 19,
        maxBounds: [[-85.05, -180], [85.05, 180]],
        maxBoundsViscosity: 1,
      }).fitBounds([[24, -125], [50, -66]], { padding: [8, 8], maxZoom: 5 });
      const updateDetail = () => map.getContainer().classList.toggle("map-overview", map.getZoom() < 5);
      map.on("zoomend", updateDetail);
      updateDetail();
      map.createPane("airports");
      map.getPane("airports").style.zIndex = 450;
      map.createPane("circles");
      map.getPane("circles").style.zIndex = 460;

      const status = document.getElementById("map-status");
      let routeError = false;
      const showError = (message) => {
        status.textContent = message;
        status.hidden = false;
      };
      addBackground(map, {
        onReady: () => { if (!routeError) status.hidden = true; },
        onFallback: () => {
          if (!routeError) showError("Showing a simplified map because the detailed background could not load.");
        },
      });

      const legends = {
        All: ["Airline Key", [
          ["#6cff7d", "American"], ["#ff0000", "Delta"], ["#426ae1", "United"],
        ]],
        American: ["American Hubs", [
          ["#ffa500", "Dallas"], ["#ff0000", "Charlotte"], ["#6cff7d", "Miami"],
          ["#ffff00", "Chicago"], ["#fd68b3", "Philadelphia"], ["#426ae1", "Pheonix"],
          ["#00ffff", "Los Angeles"], ["#6cff7d", "Washington"], ["#426ae1", "New York LGA"],
        ]],
        Delta: ["Delta Hubs", [
          ["#ff0000", "Atlanta"], ["#fd68b3", "Minneapolis"], ["#ffa500", "Detroit"],
          ["#6cff7d", "Salt Lake City"], ["#00ffff", "New York JFK"], ["#007f00", "Los Angeles"],
          ["#426ae1", "Seattle"], ["#ffddad", "New York LGA"], ["#ffff00", "Boston"],
        ]],
        United: ["United Hubs", [
          ["#ff0000", "Chicago"], ["#ffa500", "Houston"], ["#ffff00", "Denver"],
          ["#6cff7d", "Newark"], ["#426ae1", "San Fransisco"], ["#fd68b3", "Washington DC"],
          ["#00ffff", "Los Angeles"],
        ]],
      };
      const legend = L.control({ position: "bottomright" });
      let legendElement;
      legend.onAdd = () => {
        legendElement = L.DomUtil.create("div", "legend");
        L.DomEvent.disableClickPropagation(legendElement);
        L.DomEvent.disableScrollPropagation(legendElement);
        return legendElement;
      };
      const updateLegend = (airline) => {
        const [title, hubs] = legends[airline];
        legendElement.innerHTML = `<h3>${title}</h3>` + hubs.map(([color, name]) =>
          `<i style="background:${color}"></i><span>${name}</span><br>`
        ).join("") + "<h4>saumikn.com</h4>";
      };

      try {
        const names = ["All", "American", "Delta", "United"];
        const groups = await Promise.all(names.map(name => getMap(map, name.toLowerCase())));
        const mapLayers = Object.fromEntries(names.map((name, index) => [name, groups[index]]));
        mapLayers.United.addTo(map);
        L.control.layers(mapLayers, null, { collapsed: false, position: "topright" }).addTo(map);
        legend.addTo(map);
        updateLegend("United");
        map.on("baselayerchange", event => updateLegend(event.name));
      } catch (error) {
        routeError = true;
        showError("Airline routes could not load. Reload the page to try again.");
        console.error(error);
      }
    </script>
  </body>
</html>
